function updateStats() {
  document.getElementById('effects-count').textContent = discoveredEffects.size;
  document.getElementById('scene-count').textContent = currentSceneNum;
  const progress = (discoveredEffects.size / 8) * 100;
  document.getElementById('progress').style.width = progress + '%';
}

function getTypeResult() {
  const entries = Object.entries(profile);
  entries.sort((a, b) => b[1] - a[1]);
  const mainType = entries[0][0];
  const maxScore = Math.max(...entries.map(e => e[1]), 1);
  
  return {
    main: mainType,
    data: typeDescriptions[mainType],
    scores: entries.map(([key, val]) => ({
      key,
      name: typeDescriptions[key].name,
      emoji: typeDescriptions[key].emoji,
      percent: Math.round((val / maxScore) * 100)
    }))
  };
}

function renderFinal() {
  const result = getTypeResult();
  const container = document.getElementById("game-container");
  
  let html = `
    <div class="result-card">
      <h2>Твой психологический портрет</h2>
      <div class="result-type">${result.data.emoji} ${result.data.name}</div>
    </div>
    
    <div class="type-bars">
      <div style="font-size:14px; font-weight:600; color:#1f6b4a; margin-bottom:10px;">Распределение типов:</div>
  `;
  
  result.scores.forEach(s => {
    html += `
      <div class="type-bar-item">
        <div class="type-bar-label">
          <span>${s.emoji} ${s.name}</span>
          <span>${s.percent}%</span>
        </div>
        <div class="type-bar-track">
          <div class="type-bar-fill" style="width:${s.percent}%"></div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  
  html += `
    <div class="scene">
      <div class="result-desc">
        <h3>Кто ты в группе</h3>
        <p>${result.data.desc}</p>
        
        <h3>Сильные стороны</h3>
        <ul>
          ${result.data.strengths.map(s => `<li>${s}</li>`).join('')}
        </ul>
        
        <h3>Зоны роста</h3>
        <ul>
          ${result.data.weaknesses.map(w => `<li>${w}</li>`).join('')}
        </ul>
        
        <h3>Персональные советы</h3>
        ${result.data.tips.map(t => `<div class="tip">${t}</div>`).join('')}
      </div>
    </div>
    
    <button class="restart-btn" onclick="restart()">Пройти квест заново</button>
  `;
  
  container.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderScene(sceneId) {
  // Финальная сцена
  if (sceneId === 'final') {
    renderFinal();
    return;
  }
  
  const scene = scenes[sceneId];
  const container = document.getElementById("game-container");
  
  // Определяем номер сценария
  if (sceneId === 'start' || sceneId === 'conformity' || sceneId === 'minority' || sceneId === 'bystander') currentSceneNum = 1;
  else if (sceneId === 'team_start' || sceneId === 'social_loafing' || sceneId === 'social_loafing_fix' || sceneId === 'social_loafing_victim') currentSceneNum = 2;
  else if (sceneId === 'crowd_start' || sceneId === 'bystander_effect' || sceneId === 'partial_help' || sceneId === 'help_success') currentSceneNum = 3;
  else if (sceneId === 'concert_start' || sceneId === 'deindividuation' || sceneId === 'observer' || sceneId === 'balance') currentSceneNum = 4;
  else if (sceneId === 'project_start' || sceneId === 'polarization' || sceneId === 'polarization_fix' || sceneId === 'isolation') currentSceneNum = 5;
  
  scenesVisited.add(sceneId);
  
  let html = `<div class="scene">`;
  html += `<div class="scene-text">${scene.text}</div>`;
  
  if (scene.dialogue) {
    html += `<div class="dialogue">${scene.dialogue}</div>`;
  }
  
  if (scene.speakers) {
    html += `<div class="speakers">`;
    scene.speakers.forEach(s => {
      html += `
        <div class="speaker">
          <div class="speaker-avatar ${s.leader ? 'leader' : ''} ${s.you ? 'you' : ''}">${s.avatar}</div>
          <div>
            <div class="speaker-name">${s.name}</div>
            <div class="speaker-role">${s.role}</div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }
  
  if (scene.effect) {
    discoveredEffects.add(scene.effect.title);
    html += `
      <div class="effect-box">
        <h3><span class="term">ЭФФЕКТ</span> ${scene.effect.title}</h3>
        ${scene.effect.desc}
      </div>
    `;
  }
  
  html += `<div style="margin-top: 20px;">`;
  scene.choices.forEach(choice => {
    // Запоминаем тип выбора для профиля
    const typeAttr = choice.type ? `data-type="${choice.type}"` : '';
    html += `<button class="choice-btn" ${typeAttr} onclick="makeChoice('${choice.next}', '${choice.type || ''}')">${choice.text}</button>`;
  });
  html += `</div></div>`;
  
  container.innerHTML = html;
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function makeChoice(nextScene, type) {
  if (type && profile[type] !== undefined) {
    profile[type]++;
  }
  renderScene(nextScene);
}

function restart() {
  profile = { analyst: 0, conformist: 0, observer: 0, leader: 0 };
  discoveredEffects.clear();
  scenesVisited.clear();
  renderScene("start");
}

renderScene("start");
</script>

</body>
</html>
