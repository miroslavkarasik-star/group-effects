<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Квиз: Групповые эффекты</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #e8f8f0 0%, #d4f1e4 100%);
    color: #1f3d2e;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding: 16px; padding-bottom: 40px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; padding: 18px 10px 22px; }
  h1 { font-size: 22px; color: #1f6b4a; font-weight: 700; }
  .subtitle { margin-top: 6px; font-size: 14px; color: #4a7c64; }
  .progress { margin-top: 14px; height: 6px; background: #c9ecdc; border-radius: 3px; overflow: hidden; }
  .progress div { height: 100%; width: 0%; background: #2ecc71; transition: width 0.3s ease; }

  .q { background: #ffffff; border-radius: 14px; padding: 18px; margin-top: 14px; box-shadow: 0 2px 8px rgba(46, 204, 113, 0.08); border: 1px solid #d4f1e4; }
  .q h3 { font-size: 16px; line-height: 1.4; color: #1f6b4a; font-weight: 600; margin-bottom: 12px; }
  .opt { display: block; padding: 12px 14px; margin: 8px 0; background: #f4fbf7; border: 1.5px solid #d4f1e4; border-radius: 10px; font-size: 15px; line-height: 1.35; color: #1f3d2e; cursor: pointer; transition: all 0.15s ease; user-select: none; }
  .opt:active { transform: scale(0.98); }
  .opt input { margin-right: 10px; accent-color: #2ecc71; transform: scale(1.15); vertical-align: middle; }
  .opt.selected { background: #d4f1e4; border-color: #2ecc71; }

  .btn { display: block; width: 100%; margin-top: 22px; padding: 16px; background: #2ecc71; color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3); transition: all 0.15s ease; }
  .btn:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(46, 204, 113, 0.3); }
  .btn.secondary { background: #a8e6cf; color: #1f6b4a; box-shadow: none; }

  #result { display: none; margin-top: 22px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; border: 1px solid #d4f1e4; }
  .score-big { text-align: center; font-size: 40px; font-weight: 700; color: #1f6b4a; margin: 6px 0; }
  .score-label { text-align: center; color: #4a7c64; font-size: 14px; margin-bottom: 14px; }
  .bar { height: 10px; background: #e8f8f0; border-radius: 5px; overflow: hidden; margin: 10px 0; }
  .bar div { height: 100%; background: linear-gradient(90deg, #a8e6cf, #2ecc71); border-radius: 5px; transition: width 0.6s ease; }
  .scale-box { background: #f4fbf7; border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #1f3d2e; }
  .scale-box b { color: #1f6b4a; }
  .level { margin-top: 10px; padding: 10px 12px; background: #d4f1e4; border-radius: 8px; font-weight: 600; color: #1f6b4a; text-align: center; }

  .line { padding: 12px 0; border-bottom: 1px solid #e8f8f0; }
  .line:last-child { border-bottom: none; }
  .line-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
  .tag-ok { color: #27ae60; background: #d4f1e4; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .tag-no { color: #fff; background: #e74c3c; padding: 3px 8px; border-radius: 6px; font-size: 12px; }
  .explain { margin-top: 8px; padding: 10px 12px; background: #f4fbf7; border-left: 3px solid #2ecc71; border-radius: 6px; font-size: 13px; line-height: 1.5; color: #1f3d2e; }
  .explain b { color: #1f6b4a; }
  h2 { font-size: 18px; color: #1f6b4a; margin-bottom: 12px; }
  h3.section { font-size: 16px; color: #1f6b4a; margin: 14px 0 8px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Групповые эффекты</h1>
    <p class="subtitle">20 простых вопросов · выбери один вариант</p>
    <div class="progress"><div id="prog"></div></div>
  </header>

  <div id="quiz"></div>
  <button class="btn" onclick="check()">Проверить ответы</button>
  <div id="result"></div>
</div>

<script>
const questions = [
{q:"Как называется явление, когда в присутствии других людей мы делаем простые задачи лучше и быстрее?",
 a:["Группомыслие","Социальная фасилитация","Социальная лень","Деиндивидуализация"], c:1,
 e:"Фасилитация: другие люди нас «подбадривают», и знакомые действия получаются лучше."},
{q:"Почему в общей работе некоторые люди стараются меньше, чем когда работают в одиночку?",
 a:["Конформизм","Поляризация","Социальная лень","Деиндивидуализация"], c:2,
 e:"Социальная лень: если личный вклад не виден, человек расслабляется и делает меньше."},
{q:"Что происходит с мнением группы после долгого обсуждения, когда все начинают поддерживать более крайние решения?",
 a:["Групповая поляризация","Конформизм","Социальное заражение","Эффект ореола"], c:0,
 e:"Поляризация: обсуждение усиливает изначальный настрой группы, делая его более радикальным."},
{q:"Как называется ситуация, когда группа так хочет согласия, что игнорирует здравый смысл и альтернативы?",
 a:["Сплочённость","Группомыслие","Фасилитация","Социальное сравнение"], c:1,
 e:"Группомыслие: желание «не портить отношения» важнее, чем принять правильное решение."},
{q:"Почему человек реже помогает пострадавшему, если вокруг много других свидетелей?",
 a:["Эффект Рингельмана","Конформизм","Группомыслие","Эффект свидетеля"], c:3,
 e:"Эффект свидетеля: каждый думает «кто-то другой уже поможет», и ответственность размывается."},
{q:"Что происходит с человеком в толпе, когда он чувствует анонимность и перестаёт контролировать себя?",
 a:["Фасилитация","Поляризация","Деиндивидуализация","Сплочённость"], c:2,
 e:"Деиндивидуализация: «меня тут никто не знает», поэтому человек ведёт себя так, как никогда не сделал бы один."},
{q:"Как называется согласие с мнением большинства, даже если ты внутренне с ним не согласен?",
 a:["Конформизм","Деиндивидуализация","Социальная лень","Риск-сдвиг"], c:0,
 e:"Конформизм: подстройка под группу из-за давления (реального или воображаемого)."},
{q:"В каком известном эксперименте люди соглашались с неправильным ответом группы о длине линий?",
 a:["Шериф","Аш","Латане и Дарли","Рингельман"], c:1,
 e:"Эксперимент Аша: люди давали заведомо неверный ответ, лишь бы не отличаться от остальных."},
{q:"Что показал эксперимент со светящейся точкой в темноте, когда люди начинали верить оценке других?",
 a:["Падение усилий в группе","Эффект свидетеля","Влияние групповой нормы","Анонимность толпы"], c:2,
 e:"Эксперимент Шерифа: в неясной ситуации люди перенимают мнение других, создавая общую норму."},
{q:"Что показал эксперимент с перетягиванием каната (эффект Рингельмана)?",
 a:["Рост эффективности с размером группы","Улучшение памяти в группе","Появление лидера","Снижение усилий каждого при росте группы"], c:3,
 e:"Чем больше людей тянет канат, тем меньше усилий прикладывает каждый отдельный человек."},
{q:"Как называется чувство «размытой» ответственности, когда «все виноваты, значит, никто не виноват»?",
 a:["Социальная фасилитация","Диффузия ответственности","Конформизм","Сплочённость"], c:1,
 e:"Диффузия (распределение) ответственности: чувство личной вины исчезает в большой группе."},
{q:"Почему группа часто принимает более рискованные решения, чем один человек?",
 a:["Сдвиг к риску","Социальная лень","Эффект свидетеля","Деиндивидуализация"], c:0,
 e:"Сдвиг к риску: в группе ответственность делится на всех, поэтому люди решаются на большее."},
{q:"Как называется склонность считать свою группу лучше всех остальных, даже без веских причин?",
 a:["Социальное заражение","Информационное влияние","Внутригрупповой фаворитизм","Группомыслие"], c:2,
 e:"Фаворитизм: мы автоматически считаем «своих» умнее и лучше «чужих»."},
{q:"Как называется часть нашей самооценки, которая зависит от того, в какой группе мы состоим?",
 a:["Деиндивидуализация","Конформизм","Риск-сдвиг","Социальная идентичность"], c:3,
 e:"Социальная идентичность: «я горжусь тем, что я студент этого вуза / фанат этой команды»."},
{q:"Как называется явление, когда смех, паника или аплодисменты мгновенно передаются от одного человека к другим?",
 a:["Поляризация","Социальное заражение","Фасилитация","Диффузия ответственности"], c:1,
 e:"Социальное заражение: эмоции передаются бессознательно, как вирус."},
{q:"Что нужно меньшинству, чтобы со временем переубедить большинство?",
 a:["Последовательность и уверенность","Анонимность","Численное превосходство","Отказ от своей точки зрения"], c:0,
 e:"Если меньшинство твердо и спокойно держится своей позиции, большинство со временем начинает сомневаться."},
{q:"Как мы оцениваем свои успехи, когда сравниваем себя с другими людьми?",
 a:["Деиндивидуализация","Групповая сплочённость","Социальное сравнение","Социальная лень"], c:2,
 e:"Социальное сравнение: мы понимаем, «хорошо» мы сделали или «плохо», только сравнив с другими."},
{q:"Как наличие зрителей обычно влияет на выполнение СЛОЖНОЙ и незнакомой задачи?",
 a:["Всегда улучшает результат","Никак не влияет","Делает задачу короче","Обычно ухудшает результат из-за волнения"], c:3,
 e:"Зрители повышают возбуждение. Для простых задач это плюс, а для сложных — мешает и ведёт к ошибкам."},
{q:"Как называется «клей», который удерживает людей в группе и заставляет их хотеть там оставаться?",
 a:["Поляризация","Групповая сплочённость","Конформизм","Социальное заражение"], c:1,
 e:"Сплочённость: чувство дружбы, общие цели и желание быть частью команды."},
{q:"Почему человек соглашается с группой, если думает, что остальные знают лучше него?",
 a:["Информационное влияние","Нормативное влияние","Деиндивидуализация","Поляризация"], c:0,
 e:"Информационное влияние: «они, наверное, правы, раз их так много». (А нормативное — это «лишь бы не ругали»)."}
];

// Рендер вопросов
const quiz = document.getElementById("quiz");
quiz.innerHTML = questions.map((it,i)=>`
  <div class="q">
    <h3>${i+1}. ${it.q}</h3>
    ${it.a.map((t,j)=>`
      <label class="opt" data-q="${i}" data-v="${j}">
        <input type="radio" name="q${i}" value="${j}">
        ${String.fromCharCode(65+j)}) ${t}
      </label>
    `).join("")}
  </div>
`).join("");

// Подсветка выбранного варианта + прогресс-бар
document.querySelectorAll(".opt").forEach(el=>{
  el.addEventListener("click",()=>{
    const q = el.dataset.q;
    document.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>x.classList.remove("selected"));
    el.classList.add("selected");
    updateProgress();
  });
});

function updateProgress(){
  let n = 0;
  questions.forEach((_,i)=>{
    if(document.querySelector(`input[name="q${i}"]:checked`)) n++;
  });
  document.getElementById("prog").style.width = (n/questions.length*100)+"%";
}

function check(){
  let answered = 0;
  questions.forEach((_,i)=>{
    if(document.querySelector(`input[name="q${i}"]:checked`)) answered++;
  });
  if(answered < 20){
    alert("Отвечай на все вопросы! Не хватает: " + (20-answered));
    return;
  }

  let score = 0;
  let lines = "";
  questions.forEach((it,i)=>{
    const chosen = Number(document.querySelector(`input[name="q${i}"]:checked`).value);
    const right = chosen === it.c;
    if(right) score++;
    lines += `<div class="line">
      <div class="line-head">
        <span>Вопрос ${i+1}</span>
        <span class="${right?'tag-ok':'tag-no'}">${right?'✓ Верно':'✗ Ошибка'}</span>
      </div>
      ${right ? "" : `<div class="explain">
        Твой ответ: <b>${String.fromCharCode(65+chosen)}) ${it.a[chosen]}</b><br>
        Правильно: <b>${String.fromCharCode(65+it.c)} — ${it.a[it.c]}</b><br>
        ${it.e}
      </div>`}
    </div>`;
  });

  const percent = Math.round(score/20*100);
  let level = "";
  if(score>=18) level="Отлично — тему знаешь идеально!";
  else if(score>=14) level="Хорошо — есть пара мелких пробелов";
  else if(score>=10) level="Удовлетворительно — стоит перечитать";
  else level="Нужно повторить тему заново";

  const res = document.getElementById("result");
  res.innerHTML = `
    <div class="card">
      <h2> Твой результат</h2>
      <div class="score-big">${score} / 20</div>
      <div class="score-label">${percent}% правильных ответов</div>
      <div class="bar"><div style="width:${percent}%"></div></div>
      <div class="scale-box">
        <b>Шкала:</b><br>
        18–20 · отлично<br>
        14–17 · хорошо<br>
        10–13 · удовлетворительно<br>
        0–9 · нужно повторить
      </div>
      <div class="level">${level}</div>
    </div>
    <div class="card">
      <h3 class="section">Разбор ошибок</h3>
      ${lines}
    </div>
    <button class="btn secondary" onclick="restart()">Пройти ещё раз</button>
  `;
  res.style.display = "block";
  res.scrollIntoView({behavior:"smooth"});
}

function restart(){
  document.querySelectorAll('input[type="radio"]').forEach(r=>r.checked=false);
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  document.getElementById('result').style.display='none';
  document.getElementById('prog').style.width='0%';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>

</body>
</html>
